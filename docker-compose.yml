services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-custo-prato
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - CONNECTION_STRING=mongodb://mongodb:27017
    depends_on:
      - mongodb
    networks:
      - custo-prato-network

  mongodb:
    image: mongo:7.0
    container_name: custo-prato-mongodb
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - custo-prato-network

networks:
  custo-prato-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
